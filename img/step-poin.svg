<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="95" fill="#eafaf3"/>

  <!-- phone -->
  <rect x="65" y="40" width="70" height="120" rx="12" fill="#28a745"/>
  <rect x="72" y="52" width="56" height="86" rx="4" fill="#ffffff"/>

  <!-- recycle badge on screen -->
  <g transform="translate(100,90)" fill="#28a745">
    <path d="M0 -18 l12 21 h-24 z" transform="rotate(0)"/>
    <path d="M0 -18 l12 21 h-24 z" transform="rotate(120)"/>
    <path d="M0 -18 l12 21 h-24 z" transform="rotate(240)"/>
  </g>

  <!-- points text -->
  <text x="100" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#1f7a45" font-family="Arial, sans-serif">+250 Poin</text>

  <!-- home button -->
  <circle cx="100" cy="150" r="4" fill="#28a745"/>

  <!-- coins -->
  <circle cx="40" cy="150" r="18" fill="#ffd166" stroke="#f4b400" stroke-width="3"/>
  <text x="40" y="156" font-size="14" font-weight="700" text-anchor="middle" fill="#b9860a" font-family="Arial, sans-serif">Rp</text>

  <circle cx="165" cy="150" r="14" fill="#ffd166" stroke="#f4b400" stroke-width="2"/>
  <text x="165" y="155" font-size="12" font-weight="700" text-anchor="middle" fill="#b9860a" font-family="Arial, sans-serif">Rp</text>

  <!-- sparkles -->
  <g fill="#34d399">
    <circle cx="55" cy="55" r="4"/>
    <circle cx="150" cy="60" r="3"/>
    <circle cx="145" cy="170" r="3"/>
  </g>
</svg>

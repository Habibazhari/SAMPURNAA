<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9fbf2"/>
      <stop offset="100%" stop-color="#d3f7e6"/>
    </linearGradient>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#20c997"/>
      <stop offset="100%" stop-color="#28a745"/>
    </linearGradient>
  </defs>

  <!-- background blob -->
  <circle cx="250" cy="200" r="190" fill="url(#bgGrad)"/>

  <!-- ground -->
  <ellipse cx="250" cy="345" rx="190" ry="18" fill="#c4eedd"/>

  <!-- recycle bin -->
  <g>
    <rect x="190" y="180" width="120" height="140" rx="10" fill="url(#binGrad)"/>
    <rect x="178" y="160" width="144" height="26" rx="8" fill="#1e9e6f"/>
    <!-- recycle symbol -->
    <g fill="#ffffff">
      <path d="M250 205 l14 24 h-28 z" transform="rotate(0 250 217)"/>
      <path d="M250 205 l14 24 h-28 z" transform="rotate(120 250 217)"/>
      <path d="M250 205 l14 24 h-28 z" transform="rotate(240 250 217)"/>
    </g>
  </g>

  <!-- bottle -->
  <g>
    <rect x="120" y="230" width="34" height="80" rx="6" fill="#7fe3c4"/>
    <rect x="128" y="216" width="18" height="20" rx="3" fill="#7fe3c4"/>
    <rect x="120" y="255" width="34" height="14" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- paper stack -->
  <g>
    <rect x="345" y="245" width="60" height="70" rx="4" fill="#ffe08a"/>
    <rect x="352" y="255" width="46" height="6" fill="#ffffff" opacity="0.7"/>
    <rect x="352" y="268" width="46" height="6" fill="#ffffff" opacity="0.7"/>
    <rect x="352" y="281" width="32" height="6" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- can -->
  <g>
    <rect x="335" y="190" width="30" height="48" rx="4" fill="#ff9f7f"/>
    <ellipse cx="350" cy="190" rx="15" ry="5" fill="#ffb39b"/>
  </g>

  <!-- leaf / plant on top of bin -->
  <g>
    <path d="M250 160 C 230 130, 200 130, 195 105 C 230 105, 255 125, 250 160 Z" fill="#34d399"/>
    <path d="M250 160 C 270 130, 300 130, 305 105 C 270 105, 245 125, 250 160 Z" fill="#28a745"/>
  </g>

  <!-- floating coin -->
  <g>
    <circle cx="130" cy="140" r="22" fill="#ffd166"/>
    <circle cx="130" cy="140" r="22" fill="none" stroke="#f4b400" stroke-width="3"/>
    <text x="130" y="148" font-size="20" font-weight="700" text-anchor="middle" fill="#b9860a" font-family="Arial, sans-serif">Rp</text>
  </g>

  <!-- floating coin small -->
  <g>
    <circle cx="385" cy="135" r="15" fill="#ffd166"/>
    <circle cx="385" cy="135" r="15" fill="none" stroke="#f4b400" stroke-width="2"/>
    <text x="385" y="141" font-size="14" font-weight="700" text-anchor="middle" fill="#b9860a" font-family="Arial, sans-serif">Rp</text>
  </g>

  <!-- arrows showing recycling motion -->
  <path d="M170 270 C 150 230, 170 200, 190 195" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.8"/>
  <path d="M330 270 C 350 230, 330 200, 310 195" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.8"/>
</svg>

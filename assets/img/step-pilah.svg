<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="95" fill="#eafaf3"/>

  <!-- three bins -->
  <rect x="35" y="110" width="36" height="55" rx="6" fill="#34d399"/>
  <rect x="30" y="98" width="46" height="16" rx="5" fill="#28a745"/>

  <rect x="82" y="100" width="36" height="65" rx="6" fill="#60a5fa"/>
  <rect x="77" y="88" width="46" height="16" rx="5" fill="#3b82f6"/>

  <rect x="129" y="115" width="36" height="50" rx="6" fill="#fbbf24"/>
  <rect x="124" y="103" width="46" height="16" rx="5" fill="#f59e0b"/>

  <!-- recycle icons on bins -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="53" cy="135" r="9"/>
    <circle cx="100" cy="128" r="9"/>
    <circle cx="147" cy="138" r="9"/>
  </g>

  <!-- hand dropping item -->
  <g>
    <ellipse cx="100" cy="55" rx="14" ry="10" fill="#ffb38a"/>
    <rect x="92" y="60" width="16" height="18" rx="6" fill="#ffb38a"/>
  </g>

  <!-- item being dropped (bottle) -->
  <rect x="93" y="78" width="14" height="22" rx="3" fill="#34d399"/>
</svg>
